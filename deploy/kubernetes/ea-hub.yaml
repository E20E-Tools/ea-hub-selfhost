apiVersion: batch/v1
kind: CronJob
metadata:
  name: ea-hub-backup
  labels:
    app.kubernetes.io/name: ea-hub
    app.kubernetes.io/instance: ea-hub
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ea-hub-1.1.0
    app.kubernetes.io/component: backup
spec:
  schedule: "0 1 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ea-hub
            app.kubernetes.io/instance: ea-hub
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          # The uploads volume is ReadWriteOnce: run next to the web pod to read it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ea-hub
                      app.kubernetes.io/instance: ea-hub
                      app.kubernetes.io/component: web
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/sh", "/backup/backup.sh", "now"]
              env:
                - name: PGHOST
                  value: "ea-hub-postgres"
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: "eahub"
                - name: PGUSER
                  value: "postgres"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ea-hub
                      key: postgres-password
                - name: BACKUP_KEEP_DAYS
                  value: "14"
              volumeMounts:
                - name: script
                  mountPath: /backup
                - name: backups
                  mountPath: /backups
                - name: storage
                  mountPath: /data/storage
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: ea-hub-backup
            - name: backups
              persistentVolumeClaim:
                claimName: ea-hub-backups
            - name: storage
              persistentVolumeClaim:
                claimName: ea-hub-storage

