# Source: ea-hub/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ea-hub-postgres
  labels:
    app.kubernetes.io/name: ea-hub
    app.kubernetes.io/instance: ea-hub
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: ea-hub-1.1.0
    app.kubernetes.io/component: database
spec:
  serviceName: ea-hub-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ea-hub
      app.kubernetes.io/instance: ea-hub
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ea-hub
        app.kubernetes.io/instance: ea-hub
        app.kubernetes.io/component: database
    spec:
      securityContext:
        # postgres:16-alpine runs as uid/gid 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: "eahub"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ea-hub
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d \"$POSTGRES_DB\""]
            periodSeconds: 30
            failureThreshold: 6
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi

