# Copy this file (e.g. to my-secret.yaml, outside the repository), replace every CHANGE_ME,
# then: kubectl apply -f my-secret.yaml
# Generate random values with:  openssl rand -hex 32
# انسخ الملف، واستبدل كل CHANGE_ME بقيمة عشوائية، ثم طبّقه. لا ترفع النسخة المعدّلة لأي مستودع.
apiVersion: v1
kind: Secret
metadata:
  name: ea-hub
  namespace: ea-hub
type: Opaque
stringData:
  postgres-password: CHANGE_ME
  app-db-password: CHANGE_ME
  # Never change after the first start / لا تغيّره بعد أول تشغيل
  app-encryption-key: CHANGE_ME_AT_LEAST_32_CHARACTERS
  cron-secret: CHANGE_ME
  # First admin (at least 10 characters). The e-mail is ADMIN_EMAIL in ea-hub.yaml.
  admin-password: CHANGE_ME
  # Optional — delete the lines you do not use:
  # smtp-password: ""
  # resend-api-key: ""
  # openai-api-key: ""
  # groq-api-key: ""
  # turnstile-secret-key: ""
