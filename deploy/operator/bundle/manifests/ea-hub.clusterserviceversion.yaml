# EA-Hub operator bundle. On a release, the publish workflow sets version, name, containerImage
# and the manager image to the released version.
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: ea-hub.v1.3.0
  namespace: placeholder
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "ea-hub.e20e-tools.github.io/v1alpha1",
          "kind": "EAHub",
          "metadata": {
            "name": "ea-hub"
          },
          "spec": {
            "appUrl": "https://hub.example.com",
            "admin": {
              "email": "admin@example.com"
            },
            "openshift": {
              "enabled": false
            }
          }
        }
      ]
    capabilities: Seamless Upgrades
    categories: Developer Tools,Application Runtime
    containerImage: ghcr.io/e20e-tools/ea-hub-operator:1.3.0
    createdAt: '2026-11-28T00:00:00Z'
    description: Self-hosted EA-Hub (enterprise architecture hub) with its own PostgreSQL, backups and monitoring.
    repository: https://github.com/E20E-Tools/ea-hub-selfhost
    support: E20E-Tools
    operators.operatorframework.io/builder: operator-sdk-v1.42.3
    operators.operatorframework.io/project_layout: helm.sdk.operatorframework.io/v1
    features.operators.openshift.io/disconnected: 'false'
    features.operators.openshift.io/fips-compliant: 'false'
    features.operators.openshift.io/proxy-aware: 'false'
    features.operators.openshift.io/tls-profiles: 'false'
    features.operators.openshift.io/token-auth-aws: 'false'
    features.operators.openshift.io/token-auth-azure: 'false'
    features.operators.openshift.io/token-auth-gcp: 'false'
    features.operators.openshift.io/cnf: 'false'
    features.operators.openshift.io/cni: 'false'
    features.operators.openshift.io/csi: 'false'
spec:
  displayName: EA-Hub
  description: |
    EA-Hub is an enterprise architecture hub that runs entirely on your cluster with its own
    PostgreSQL: no external services are needed.

    The operator installs and keeps up to date the official EA-Hub Helm chart. Each `EAHub` resource is
    one installation; its `spec` holds the chart values
    ([values reference](https://github.com/E20E-Tools/ea-hub-selfhost/blob/main/deploy/helm/ea-hub/values.yaml)).

    ### What gets deployed
    * the EA-Hub web app (database changes are applied automatically on start)
    * PostgreSQL 16 (or CloudNativePG with `postgres.mode: cloudnativepg`, or an external database)
    * daily backups with optional encryption and off-site copy, scheduled jobs, metrics and alerts
    * on OpenShift (`openshift.enabled: true`): random UIDs and a Route with edge TLS

    ### Quick start
    ```yaml
    apiVersion: ea-hub.e20e-tools.github.io/v1alpha1
    kind: EAHub
    metadata:
      name: ea-hub
    spec:
      appUrl: https://hub.example.com
      admin:
        email: admin@example.com
    ```
    Passwords are generated into the Secret `ea-hub`. Read the first admin password with
    `kubectl get secret ea-hub -o jsonpath='{.data.admin-password}' | base64 -d`. Do not put passwords in
    the `spec` (it is stored in plain text): use `secrets.create: false` with `secrets.existingSecret`
    for a Secret you manage yourself.

    Documentation: https://e20e-tools.github.io/ea-hub-selfhost/docs/
  version: 1.3.0
  minKubeVersion: 1.25.0
  maturity: stable
  provider:
    name: E20E-Tools
    url: https://github.com/E20E-Tools
  maintainers:
  - name: E20E-Tools
    email: noreply@github.com
  links:
  - name: Source
    url: https://github.com/E20E-Tools/ea-hub-selfhost
  - name: Documentation
    url: https://e20e-tools.github.io/ea-hub-selfhost/docs/
  keywords:
  - ea-hub
  - enterprise architecture
  - architecture
  - postgresql
  - self-hosted
  icon:
  - base64data: 
    mediatype: image/png
  installModes:
  - type: OwnNamespace
    supported: true
  - type: SingleNamespace
    supported: true
  - type: MultiNamespace
    supported: false
  - type: AllNamespaces
    supported: true
  customresourcedefinitions:
    owned:
    - name: eahubs.ea-hub.e20e-tools.github.io
      version: v1alpha1
      kind: EAHub
      displayName: EA-Hub
      description: An EA-Hub installation (the spec holds the Helm chart values).
      resources:
      - kind: Deployment
        name: ''
        version: v1
      - kind: StatefulSet
        name: ''
        version: v1
      - kind: Service
        name: ''
        version: v1
      - kind: Secret
        name: ''
        version: v1
      - kind: CronJob
        name: ''
        version: v1
      specDescriptors:
      - path: appUrl
        displayName: Site address
        description: Public address, e.g. https://hub.example.com
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: admin.email
        displayName: First admin e-mail
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:text
      - path: openshift.enabled
        displayName: OpenShift mode
        x-descriptors:
        - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
  install:
    strategy: deployment
    spec:
      clusterPermissions:
      - serviceAccountName: ea-hub-operator
        rules:
        - apiGroups:
          - ea-hub.e20e-tools.github.io
          resources:
          - eahubs
          - eahubs/status
          - eahubs/finalizers
          verbs: &id001
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - ''
          resources:
          - secrets
          - configmaps
          - services
          - persistentvolumeclaims
          - pods
          - serviceaccounts
          verbs: *id001
        - apiGroups:
          - ''
          resources:
          - events
          verbs:
          - create
          - patch
        - apiGroups:
          - ''
          resources:
          - namespaces
          verbs:
          - get
        - apiGroups:
          - apps
          resources:
          - deployments
          - statefulsets
          verbs: *id001
        - apiGroups:
          - batch
          resources:
          - jobs
          - cronjobs
          verbs: *id001
        - apiGroups:
          - networking.k8s.io
          resources:
          - ingresses
          - networkpolicies
          verbs: *id001
        - apiGroups:
          - policy
          resources:
          - poddisruptionbudgets
          verbs: *id001
        - apiGroups:
          - autoscaling
          resources:
          - horizontalpodautoscalers
          verbs: *id001
        - apiGroups:
          - route.openshift.io
          resources:
          - routes
          - routes/custom-host
          verbs: *id001
        - apiGroups:
          - monitoring.coreos.com
          resources:
          - servicemonitors
          - prometheusrules
          verbs: *id001
        - apiGroups:
          - postgresql.cnpg.io
          resources:
          - clusters
          verbs: *id001
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs: *id001
      deployments:
      - name: ea-hub-operator
        label: &id002
          app.kubernetes.io/name: ea-hub-operator
        spec:
          replicas: 1
          selector:
            matchLabels: *id002
          template:
            metadata:
              labels: *id002
            spec:
              serviceAccountName: ea-hub-operator
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              terminationGracePeriodSeconds: 10
              containers:
              - name: manager
                image: ghcr.io/e20e-tools/ea-hub-operator:1.3.0
                args:
                - --leader-elect
                - --leader-election-id=ea-hub-operator
                - --health-probe-bind-address=:8081
                - --metrics-bind-address=:8080
                env:
                - name: WATCH_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['olm.targetNamespaces']
                ports:
                - name: metrics
                  containerPort: 8080
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: '1'
                    memory: 768Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
