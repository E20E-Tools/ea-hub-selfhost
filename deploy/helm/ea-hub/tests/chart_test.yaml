# helm-unittest suite (https://github.com/helm-unittest/helm-unittest). Run: helm unittest deploy/helm/ea-hub
suite: EA-Hub chart
release:
  name: ea-hub
  namespace: ea-hub
set:
  appUrl: https://hub.example.com
tests:
  - it: uses fixed non-root UIDs by default
    template: templates/deployment.yaml
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 1000 }
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }

  - it: OpenShift mode leaves UIDs to the SCC
    template: templates/deployment.yaml
    set:
      openshift.enabled: true
    asserts:
      - notExists: { path: spec.template.spec.securityContext.runAsUser }
      - notExists: { path: spec.template.spec.securityContext.fsGroup }

  - it: OpenShift mode uses the Debian postgres image
    template: templates/postgres.yaml
    set:
      openshift.enabled: true
    documentSelector: { path: kind, value: StatefulSet }
    asserts:
      - equal: { path: "spec.template.spec.containers[0].image", value: "postgres:16" }

  - it: OpenShift mode creates a Route
    template: templates/route.yaml
    set:
      openshift.enabled: true
    asserts:
      - isKind: { of: Route }

  - it: external database removes the built-in PostgreSQL
    template: templates/postgres.yaml
    set:
      postgres.enabled: false
      externalDatabase.host: db.example.com
    asserts:
      - hasDocuments: { count: 0 }

  - it: generates an admin password when only the e-mail is given
    template: templates/secret.yaml
    set:
      admin.email: admin@example.com
    asserts:
      - exists: { path: data.admin-password }

  - it: no admin password without an admin e-mail
    template: templates/secret.yaml
    asserts:
      - notExists: { path: data.admin-password }

  - it: metrics adds a generated token
    template: templates/secret.yaml
    set:
      metrics.enabled: true
    asserts:
      - exists: { path: data.metrics-token }

  - it: no PodDisruptionBudget with a single replica
    template: templates/monitoring-policies.yaml
    asserts:
      - hasDocuments: { count: 0 }

  - it: PodDisruptionBudget with two replicas
    template: templates/monitoring-policies.yaml
    set:
      replicaCount: 2
      storage.accessMode: ReadWriteMany
    asserts:
      - isKind: { of: PodDisruptionBudget }
      - equal: { path: spec.minAvailable, value: 1 }

  - it: ServiceMonitor scrapes /metrics with the token
    template: templates/monitoring-policies.yaml
    set:
      metrics.enabled: true
      metrics.serviceMonitor.enabled: true
    asserts:
      - isKind: { of: ServiceMonitor }
      - equal: { path: "spec.endpoints[0].path", value: /metrics }
      - equal: { path: "spec.endpoints[0].authorization.credentials.key", value: metrics-token }

  - it: NetworkPolicy limits PostgreSQL to this release
    template: templates/monitoring-policies.yaml
    set:
      networkPolicy.enabled: true
    documentSelector: { path: metadata.name, value: ea-hub-postgres }
    asserts:
      - equal: { path: "spec.ingress[0].from[0].podSelector.matchLabels[\"app.kubernetes.io/instance\"]", value: ea-hub }

  - it: offsite backup runs rclone after the backup
    template: templates/backup.yaml
    set:
      backup.offsite.enabled: true
      backup.offsite.path: bucket/eahub
      backup.offsite.credentials.access_key_id: AK
    documentSelector: { path: kind, value: CronJob }
    asserts:
      - equal: { path: "spec.jobTemplate.spec.template.spec.initContainers[0].name", value: backup }
      - equal: { path: "spec.jobTemplate.spec.template.spec.containers[0].name", value: offsite }
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].args"
          content: "offsite:bucket/eahub"

  - it: offsite backup requires a path
    template: templates/backup.yaml
    set:
      backup.offsite.enabled: true
    asserts:
      - failedTemplate: {}

  - it: S3 uploads need no storage volume
    template: templates/deployment.yaml
    set:
      storage.backend: s3
      storage.s3.bucket: uploads
      replicaCount: 2
    asserts:
      - notExists: { path: spec.template.spec.volumes }
      - notExists: { path: spec.strategy }
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: { name: S3_BUCKET, value: uploads }

  - it: S3 uploads remove the uploads PVC
    template: templates/service-ingress-pvc.yaml
    set:
      storage.backend: s3
      storage.s3.bucket: uploads
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Service }

  - it: S3 mode requires a bucket
    template: templates/deployment.yaml
    set:
      storage.backend: s3
    asserts:
      - failedTemplate:
          errorMessage: storage.s3.bucket is required when storage.backend=s3

  - it: takes a backup before every upgrade
    template: templates/backup.yaml
    documentSelector: { path: metadata.name, value: ea-hub-backup-before-upgrade }
    asserts:
      - isKind: { of: Job }
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: pre-upgrade }
      - equal: { path: "spec.template.spec.containers[0].name", value: backup }

  - it: the pre-upgrade backup can be turned off
    template: templates/backup.yaml
    set:
      backup.beforeUpgrade: false
    asserts:
      - hasDocuments: { count: 3 }   # ConfigMap, PVC and CronJob only
