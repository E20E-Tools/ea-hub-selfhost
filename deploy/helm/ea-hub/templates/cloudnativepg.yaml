{{- if include "ea-hub.cnpg" . }}
{{- $name := include "ea-hub.fullname" . }}
{{- if .Values.secrets.create }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $old := $existing.data | default dict }}
# The CloudNativePG superuser: same password as the release's postgres-password key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-pg-superuser
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
data:
  username: {{ "postgres" | b64enc }}
  password: {{ include "ea-hub.postgresPasswordB64" (dict "root" . "old" $old) }}
---
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}-pg
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.postgres.cloudnativepg.instances }}
  # Same major version as the backup tools (postgres.image): pg_dump cannot dump a newer server.
  imageName: {{ .Values.postgres.cloudnativepg.imageName | default "ghcr.io/cloudnative-pg/postgresql:16" }}
  enableSuperuserAccess: true
  superuserSecret:
    name: {{ if .Values.secrets.create }}{{ $name }}-pg-superuser{{ else }}{{ .Values.secrets.existingSecret }}-pg-superuser{{ end }}
  bootstrap:
    initdb:
      # The operator's own "app" role owns the empty database; EA-Hub's setup runs as the
      # superuser (owner "postgres" here would make the operator reset postgres's password).
      database: {{ .Values.postgres.database }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  {{- with .Values.postgres.cloudnativepg.backup }}
  backup:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.postgres.cloudnativepg.podMonitor }}
  monitoring:
    enablePodMonitor: true
  {{- end }}
{{- end }}
