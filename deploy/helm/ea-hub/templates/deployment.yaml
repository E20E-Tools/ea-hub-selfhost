apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ea-hub.fullname" . }}
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not (.Values.autoscaling | default dict).enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if and (include "ea-hub.fileStorage" .) (eq .Values.storage.accessMode "ReadWriteOnce") }}
  # A ReadWriteOnce upload volume can only be mounted by one pod at a time.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "ea-hub.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "ea-hub.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.migrate.initContainer }}
      initContainers:
        - name: migrate
          image: {{ include "ea-hub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "selfhost/scripts/migrate.mjs"]
          env:
            {{- include "ea-hub.migrateEnv" . | nindent 12 }}
          securityContext:
            {{- include "ea-hub.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      {{- end }}
      containers:
        - name: app
          image: {{ include "ea-hub.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- include "ea-hub.appEnv" . | nindent 12 }}
          {{- if include "ea-hub.fileStorage" . }}
          volumeMounts:
            - name: storage
              mountPath: /data/storage
          {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            {{- include "ea-hub.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if include "ea-hub.fileStorage" . }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim | default (printf "%s-storage" (include "ea-hub.fullname" .)) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
