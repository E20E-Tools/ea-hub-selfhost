{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ea-hub.fullname" . }}
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ea-hub.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "ea-hub.secretName" . }}
          key: metrics-token
---
{{- end }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ea-hub.fullname" . }}
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "ea-hub.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
# The app: reachable on its HTTP port from the listed namespaces (ingress controller,
# OpenShift router, monitoring) and from this release's own jobs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ea-hub.fullname" . }}-web
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ea-hub.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if .Values.networkPolicy.ingressNamespaceSelectors }}
        {{- range .Values.networkPolicy.ingressNamespaceSelectors }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
{{- if .Values.postgres.enabled }}
---
# PostgreSQL: only pods of this release (app, migrations, jobs, backups) may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ea-hub.fullname" . }}-postgres
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ea-hub.selector" . | nindent 6 }}
      app.kubernetes.io/component: database
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 5432
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
