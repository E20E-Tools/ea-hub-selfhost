{{- if .Values.backup.enabled }}
{{- $offsite := .Values.backup.offsite }}
{{- if and $offsite.enabled (not $offsite.existingSecret) $offsite.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ea-hub.fullname" . }}-offsite
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := $offsite.credentials }}
  {{ $k | upper }}: {{ $v | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ea-hub.fullname" . }}-backup
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
data:
  # Same file as selfhost/backup/backup.sh (CI checks they match).
  backup.sh: |
    {{- .Files.Get "files/backup.sh" | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ea-hub.fullname" . }}-backups
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ea-hub.fullname" . }}-backup
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.cron.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      {{- include "ea-hub.backupJobSpec" . | nindent 6 }}
{{- if .Values.backup.beforeUpgrade }}
---
# A backup right before every helm upgrade (database migrations run during the upgrade).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ea-hub.fullname" . }}-backup-before-upgrade
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  {{- include "ea-hub.backupJobSpec" . | nindent 2 }}
{{- end }}
{{- end }}
