{{- if .Values.backup.enabled }}
{{- $offsite := .Values.backup.offsite }}
{{- if and $offsite.enabled (not $offsite.existingSecret) $offsite.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ea-hub.fullname" . }}-offsite
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := $offsite.credentials }}
  {{ $k | upper }}: {{ $v | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ea-hub.fullname" . }}-backup
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
data:
  # Same file as selfhost/backup/backup.sh (CI checks they match).
  backup.sh: |
    {{- .Files.Get "files/backup.sh" | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ea-hub.fullname" . }}-backups
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ea-hub.fullname" . }}-backup
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.cron.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "ea-hub.selector" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- if and (include "ea-hub.fileStorage" .) (eq .Values.storage.accessMode "ReadWriteOnce") }}
          # The uploads volume is ReadWriteOnce: run next to the web pod to read it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- include "ea-hub.selector" . | nindent 22 }}
                      app.kubernetes.io/component: web
          {{- end }}
          {{- if $offsite.enabled }}
          # The backup runs first; the rclone container then copies it off the cluster.
          initContainers:
          {{- else }}
          containers:
          {{- end }}
            - name: backup
              image: {{ include "ea-hub.postgresImage" . }}
              command: ["/bin/sh", "/backup/backup.sh", "now"]
              env:
                - name: PGHOST
                  value: {{ include "ea-hub.dbHost" . | quote }}
                - name: PGPORT
                  value: {{ include "ea-hub.dbPort" . | quote }}
                - name: PGDATABASE
                  value: {{ include "ea-hub.dbName" . | quote }}
                - name: PGUSER
                  value: {{ include "ea-hub.dbAdminUser" . | quote }}
                {{- include "ea-hub.secretEnv" (dict "root" . "name" "PGPASSWORD" "key" "postgres-password") | nindent 16 }}
                {{- if and (not .Values.postgres.enabled) .Values.externalDatabase.sslmode }}
                - name: PGSSLMODE
                  value: {{ .Values.externalDatabase.sslmode | quote }}
                {{- end }}
                - name: BACKUP_KEEP_DAYS
                  value: {{ .Values.backup.keepDays | quote }}
              volumeMounts:
                - name: script
                  mountPath: /backup
                - name: backups
                  mountPath: /backups
                {{- if include "ea-hub.fileStorage" . }}
                - name: storage
                  mountPath: /data/storage
                  readOnly: true
                {{- end }}
          {{- if $offsite.enabled }}
          containers:
            - name: offsite
              image: {{ $offsite.image }}
              command: ["rclone"]
              args:
                - copy
                - /backups
                - "offsite:{{ required "backup.offsite.path is required (bucket/folder)" $offsite.path }}"
                - --exclude=*.partial/**
                - --max-age=48h
                - --stats-one-line
                - -v
              env:
                - name: HOME
                  value: /tmp
                {{- range $k, $v := $offsite.config }}
                - name: RCLONE_CONFIG_OFFSITE_{{ $k | upper }}
                  value: {{ $v | toString | quote }}
                {{- end }}
              {{- if or $offsite.existingSecret $offsite.credentials }}
              envFrom:
                - prefix: RCLONE_CONFIG_OFFSITE_
                  secretRef:
                    name: {{ $offsite.existingSecret | default (printf "%s-offsite" (include "ea-hub.fullname" .)) }}
              {{- end }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
                  readOnly: true
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { memory: 512Mi }
          {{- end }}
          volumes:
            - name: script
              configMap:
                name: {{ include "ea-hub.fullname" . }}-backup
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "ea-hub.fullname" . }}-backups
            {{- if include "ea-hub.fileStorage" . }}
            - name: storage
              persistentVolumeClaim:
                claimName: {{ .Values.storage.existingClaim | default (printf "%s-storage" (include "ea-hub.fullname" .)) }}
            {{- end }}
{{- end }}
