{{- if .Values.secrets.create }}
{{- $name := include "ea-hub.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $old := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ea-hub.labels" . | nindent 4 }}
  annotations:
    # Keep generated secrets when the release is uninstalled by mistake.
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ include "ea-hub.postgresPasswordB64" (dict "root" . "old" $old) }}
  app-db-password: {{ include "ea-hub.keep" (dict "value" .Values.secrets.appDbPassword "old" $old "key" "app-db-password" "length" 32) }}
  app-encryption-key: {{ include "ea-hub.keep" (dict "value" .Values.secrets.appEncryptionKey "old" $old "key" "app-encryption-key" "length" 64) }}
  cron-secret: {{ include "ea-hub.keep" (dict "value" .Values.secrets.cronSecret "old" $old "key" "cron-secret" "length" 48) }}
  {{- if .Values.admin.password }}
  admin-password: {{ .Values.admin.password | b64enc }}
  {{- else if hasKey $old "admin-password" }}
  admin-password: {{ index $old "admin-password" }}
  {{- else if .Values.admin.email }}
  {{- /* One-click installs (catalogs): generate the first admin password; NOTES shows how to read it. */}}
  admin-password: {{ randAlphaNum 20 | b64enc }}
  {{- end }}
  {{- with .Values.sso.oidc.clientSecret }}
  oidc-client-secret: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.storage.s3.accessKeyId }}
  s3-access-key-id: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.storage.s3.secretAccessKey }}
  s3-secret-access-key: {{ . | b64enc }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  metrics-token: {{ include "ea-hub.keep" (dict "value" "" "old" $old "key" "metrics-token" "length" 40) }}
  {{- end }}
  {{- with .Values.smtp.password }}
  smtp-password: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.mail.resendApiKey }}
  resend-api-key: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.features.openaiApiKey }}
  openai-api-key: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.features.groqApiKey }}
  groq-api-key: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.features.turnstileSecretKey }}
  turnstile-secret-key: {{ . | b64enc }}
  {{- end }}
{{- end }}
