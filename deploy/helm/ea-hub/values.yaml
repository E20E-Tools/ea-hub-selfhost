# EA-Hub Helm values. Every key is optional unless marked REQUIRED.
# Quick start (all secrets are generated for you and kept across upgrades):
#
#   helm upgrade --install ea-hub ./deploy/helm/ea-hub -n ea-hub --create-namespace \
#     --set appUrl=https://hub.example.com \
#     --set ingress.enabled=true --set ingress.host=hub.example.com \
#     --set admin.email=you@example.com --set admin.password='a-long-password'
#
# Or run ./setup.sh --helm, which asks questions and writes ea-hub-values.yaml.
# الشرح بالعربية: docs/helm.md

# -- REQUIRED. The address people open in the browser (no trailing slash). Used in links,
# e-mails and signed file URLs.
appUrl: "http://ea-hub.local"

image:
  repository: ghcr.io/e20e-tools/ea-hub-selfhost
  # -- Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
# -- Needed when the image is private, e.g. [{name: ghcr-pull}]. See docs/helm.md.
imagePullSecrets: []

# -- Keep 1 unless uploads are shared: storage.backend=s3, or storage.accessMode=ReadWriteMany.
replicaCount: 1

# First admin account. Created on first install only; later changes are ignored unless
# admin.resetPassword=true (then set it back to false).
admin:
  email: ""
  password: ""
  resetPassword: false

secrets:
  # -- false = use secrets.existingSecret instead (keys listed in docs/helm.md).
  create: true
  # -- Name of a Secret you manage yourself (when create=false).
  existingSecret: ""
  # Leave empty to generate random values on first install; they are kept on upgrades.
  postgresPassword: ""
  appDbPassword: ""
  # -- Never change after the first install (sessions and saved keys depend on it).
  appEncryptionKey: ""
  cronSecret: ""

# Single sign-on with OpenID Connect (Microsoft Entra ID, Keycloak, Okta, Google, Authentik…).
# Off until issuer, clientId and clientSecret are set. Register this redirect URI at the
# provider: <appUrl>/api/selfhost/auth/oidc/callback. See docs/en/single-sign-on.md.
sso:
  oidc:
    # -- e.g. https://login.microsoftonline.com/<tenant-id>/v2.0 or https://kc.example.com/realms/acme
    issuer: ""
    clientId: ""
    # -- Stored in the release Secret (key oidc-client-secret).
    clientSecret: ""
    scopes: "openid email profile"
    buttonLabel: "Sign in with your organisation account"
    # -- E-mails that become EA-Hub admins when they sign in (comma-separated).
    adminEmails: ""
    # -- Group names/IDs (from groupsClaim) whose members become admins (comma-separated).
    adminGroups: ""
    groupsClaim: groups
    # -- Comma-separated e-mail domains allowed to sign in, e.g. "acme.com,acme.de".
    # Strongly recommended; required for autoCreate and for requireVerifiedEmail=false.
    allowedDomains: ""
    # -- true: create accounts (without roles) for anyone from allowedDomains.
    autoCreate: false
    # -- Keep true. For Microsoft Entra ID add the optional claim xms_edov (see the guide).
    requireVerifiedEmail: true

# Outgoing e-mail (password reset, notifications, newsletter). Optional.
smtp:
  host: ""
  port: 587
  # -- true for port 465 (implicit TLS)
  secure: false
  user: ""
  password: ""
  from: ""
mail:
  # -- Alternative to SMTP: a Resend API key.
  resendApiKey: ""
  notifyFrom: ""
  newsletterFrom: ""

# Optional features — each one turns on only when its key is set.
features:
  # -- Search by meaning (OpenAI embeddings).
  openaiApiKey: ""
  # -- AI assistant provider (can also be set in the admin console).
  groqApiKey: ""
  # -- Cloudflare Turnstile bot protection: set both or neither.
  turnstileSiteKey: ""
  turnstileSecretKey: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # -- e.g. nginx, traefik. Empty = cluster default.
  className: ""
  host: ""
  # -- Serve HTTPS. With cert-manager add the issuer annotation below.
  tls: false
  # -- Defaults to <release>-tls.
  tlsSecretName: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/proxy-body-size: 12m

openshift:
  # -- Red Hat OpenShift / OKD: let the restricted SCC choose user and group IDs (no fixed
  # UIDs in the pods), use the Debian postgres image (works with random UIDs), and publish
  # the site with a Route. Leave ingress.enabled=false when you use the Route.
  enabled: false
  route:
    enabled: true
    # -- Empty = OpenShift generates <release>-<namespace>.<apps domain>.
    host: ""
    # -- Edge TLS with the router certificate; HTTP redirects to HTTPS.
    tls: true
    annotations: {}

# -- Number of trusted reverse-proxy hops in front of the app (the ingress controller = 1).
# Used to read the visitor IP from X-Forwarded-For for rate limiting.
trustProxyHops: 1

# Uploaded files (logos, product images, attachments).
storage:
  # -- filesystem = a volume (PVC); s3 = an S3-compatible bucket (AWS S3, MinIO, Ceph, R2…),
  # which lets several app replicas share uploads. Files are still served through the app.
  backend: filesystem
  s3:
    bucket: ""
    # -- e.g. eu-central-1 (any value for MinIO).
    region: us-east-1
    # -- Empty for AWS; e.g. https://minio.example.com for S3-compatible services.
    endpoint: ""
    # -- "true"/"false"; empty = path-style when an endpoint is set.
    forcePathStyle: ""
    # -- Folder inside the bucket.
    prefix: ""
    # Credentials, stored in the release Secret (or set s3-access-key-id and
    # s3-secret-access-key in secrets.existingSecret).
    accessKeyId: ""
    secretAccessKey: ""
  # The settings below are for backend=filesystem.
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  # -- Use an existing PVC instead of creating one.
  existingClaim: ""
  maxUploadMb: 10

# Built-in PostgreSQL (a StatefulSet with its own volume).
postgres:
  enabled: true
  image: postgres:16-alpine
  database: eahub
  storage:
    size: 10Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# Your own PostgreSQL 16+ (when postgres.enabled=false). The admin user must be able to
# create roles (the app gets its own least-privilege login role).
externalDatabase:
  host: ""
  port: 5432
  database: eahub
  adminUser: postgres
  # -- e.g. require
  sslmode: ""

migrate:
  # -- Run database migrations in an init container before each app pod starts (safe to repeat).
  initContainer: true
  # -- Also run them as a Helm hook Job on every install/upgrade.
  job:
    enabled: false

# Scheduled jobs (replace Vercel Cron). Times are UTC.
cron:
  enabled: true
  timeZone: "Etc/UTC"
  schedules:
    newsletter: "0 6 * * *"
    dailyCleanup: "30 2 * * *"
    semanticIndex: "15 3 * * *"

# Daily database + uploads backup to its own volume (built-in PostgreSQL or external).
backup:
  enabled: true
  # -- Take a backup before every helm upgrade (a pre-upgrade hook), so a failed upgrade can
  # be rolled back with the data as it was.
  beforeUpgrade: true
  schedule: "0 1 * * *"
  keepDays: 14
  storage:
    size: 20Gi
    storageClass: ""

  # Copy each backup to object storage outside the cluster (S3, Azure Blob, Google Cloud
  # Storage, MinIO…) with rclone, right after it is written. Old copies are not deleted:
  # use the bucket's lifecycle rules for retention.
  offsite:
    enabled: false
    image: rclone/rclone:1.76.0
    # -- Destination "bucket/folder" (S3, GCS) or "container/folder" (Azure Blob).
    path: ""
    # -- rclone remote settings without secrets, e.g. {type: s3, provider: AWS, region: eu-central-1}
    # or {type: s3, provider: Minio, endpoint: https://minio.example.com} or
    # {type: azureblob, account: mystorage}. Keys follow rclone's documentation.
    config:
      type: s3
      provider: AWS
    # -- Secret settings for the remote, e.g. {access_key_id: …, secret_access_key: …} for S3
    # or {key: …} for Azure Blob. Stored in the release Secret.
    credentials: {}
    # -- Or a Secret you manage: each key becomes an rclone setting, written in UPPER CASE
    # (e.g. ACCESS_KEY_ID, SECRET_ACCESS_KEY, or KEY for Azure Blob).
    existingSecret: ""

# Prometheus metrics at /metrics (token-protected; generated token kept in the Secret).
metrics:
  enabled: false
  serviceMonitor:
    # -- Create a ServiceMonitor (needs the Prometheus Operator CRDs).
    enabled: false
    interval: 30s
    labels: {}

# -- Keep at least one app pod during node drains. Only rendered when replicaCount > 1.
podDisruptionBudget:
  enabled: true

# Restrict traffic to PostgreSQL (only this release's pods may connect) and to the app
# (only the ingress controller / router namespaces you list, plus this release's jobs).
networkPolicy:
  enabled: false
  # -- Namespaces whose pods may reach the app, by label. Empty = any namespace.
  # e.g. [{kubernetes.io/metadata.name: ingress-nginx}] or, on OpenShift,
  # [{policy-group.network.openshift.io/ingress: ""}]
  ingressNamespaceSelectors: []

resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 1536Mi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
