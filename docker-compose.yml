# EA-Hub — self-hosted with Docker Compose.
#
#   1) ./setup.sh            (Windows: .\setup.ps1)   asks a few questions and writes .env
#   2) docker compose up -d                          starts everything
#
# Services:
#   db       PostgreSQL 16 (data in the `db-data` volume)
#   migrate  prepares the database and the first admin, then exits
#   app      the EA-Hub web app (uploads in the `storage-data` volume)
#   caddy    web server in front: automatic HTTPS for a real domain, plain HTTP otherwise
#   cron     runs the daily jobs (newsletter, cleanup, search index) — replaces Vercel Cron
#   backup   daily database + uploads backup into ./backups (keeps BACKUP_KEEP_DAYS days)
#
# Every setting lives in .env (see .env.example). Nothing here needs editing.

name: ea-hub

x-app-env: &app-env
  APP_URL: ${APP_URL:?APP_URL is missing — run ./setup.sh}
  DB_HOST: db
  DB_NAME: ${POSTGRES_DB:-eahub}
  APP_DB_USER: eahub_app
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is missing — run ./setup.sh}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is missing — run ./setup.sh}
  CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is missing — run ./setup.sh}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  TRUST_PROXY_HOPS: "1"
  STORAGE_MAX_UPLOAD_MB: ${STORAGE_MAX_UPLOAD_MB:-10}
  # Uploads: "filesystem" (the storage-data volume) or "s3" (an S3-compatible bucket).
  STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
  # Single sign-on (OpenID Connect). Off unless OIDC_ISSUER, OIDC_CLIENT_ID and OIDC_CLIENT_SECRET are set.
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Sign in with your organisation account}
  OIDC_ADMIN_EMAILS: ${OIDC_ADMIN_EMAILS:-}
  OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-}
  OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
  OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-false}
  OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
  S3_PREFIX: ${S3_PREFIX:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # Mail (optional). SMTP works with any provider; RESEND_API_KEY is the upstream default.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  NOTIFY_FROM: ${NOTIFY_FROM:-}
  NEWSLETTER_FROM: ${NEWSLETTER_FROM:-}
  # Optional features: each one turns on only when its key is set.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

x-image: &image
  image: ${EA_HUB_IMAGE:-ghcr.io/e20e-tools/ea-hub-selfhost:latest}
  # No access to the published image? `docker compose build` builds it from this folder.
  build:
    context: .
    args:
      WITH_LOCAL_MODEL: ${WITH_LOCAL_MODEL:-1}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing — run ./setup.sh}
      POSTGRES_DB: ${POSTGRES_DB:-eahub}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-eahub}"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *image
    restart: "no"
    command: ["node", "selfhost/scripts/migrate.mjs"]
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-eahub}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: eahub_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *image
    restart: unless-stopped
    init: true
    environment: *app-env
    volumes:
      - storage-data:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  cron:
    <<: *image
    restart: unless-stopped
    init: true
    command: ["node", "selfhost/scripts/cron.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
      JOB_BASE_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup/backup.sh", "loop"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-eahub}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-1}
    volumes:
      - ./selfhost/backup:/backup:ro
      - ./backups:/backups
      - storage-data:/data/storage
    depends_on:
      db:
        condition: service_healthy

  # Optional: copy ./backups to object storage outside this server every hour (rclone).
  # Turn on with COMPOSE_PROFILES=offsite and the OFFSITE_* settings in .env.
  offsite:
    image: rclone/rclone:1.76.0
    profiles: [offsite]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          rclone copy /backups "offsite:$$OFFSITE_PATH" --exclude '*.partial/**' --stats-one-line -v \
            || echo "[offsite] copy failed"
          sleep "$$OFFSITE_INTERVAL_SECONDS"
        done
    environment:
      HOME: /tmp
      OFFSITE_PATH: ${OFFSITE_PATH:-}
      OFFSITE_INTERVAL_SECONDS: ${OFFSITE_INTERVAL_SECONDS:-3600}
      RCLONE_CONFIG_OFFSITE_TYPE: ${OFFSITE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-AWS}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ACCOUNT: ${OFFSITE_AZURE_ACCOUNT:-}
      RCLONE_CONFIG_OFFSITE_KEY: ${OFFSITE_AZURE_KEY:-}
    volumes:
      - ./backups:/backups:ro

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
