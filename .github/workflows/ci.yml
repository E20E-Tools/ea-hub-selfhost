# Self-host CI: tests, Helm checks, Docker Compose end-to-end, and a real Kubernetes (kind) install.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"] # documentation-only changes do not need the full CI
  pull_request:
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: eahub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Prepare database (bootstrap + upstream migrations + admin)
        env:
          DATABASE_ADMIN_URL: postgres://postgres:ci-postgres-password@localhost:5432/eahub
          APP_DB_PASSWORD: ci-app-password
          ADMIN_EMAIL: ci-admin@example.com
          ADMIN_PASSWORD: ci-admin-password
        run: |
          node selfhost/scripts/migrate.mjs
          # A second run must be a harmless no-op.
          node selfhost/scripts/migrate.mjs
      - name: Unit + integration tests
        env:
          # The app's least-privilege login role, exactly as in production.
          SELFHOST_TEST_DATABASE_URL: postgres://eahub_app:ci-app-password@localhost:5432/eahub
        run: npx vitest run
      - name: Uploads on S3 (test S3 server) — signer, blob store and the storage API
        env:
          SELFHOST_TEST_DATABASE_URL: postgres://eahub_app:ci-app-password@localhost:5432/eahub
          SELFHOST_TEST_S3_ENDPOINT: http://localhost:9000
          SELFHOST_TEST_S3_ACCESS_KEY_ID: ci-s3
          SELFHOST_TEST_S3_SECRET_ACCESS_KEY: ci-s3-password
          STORAGE_BACKEND: s3
          S3_BUCKET: ea-hub-test
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY_ID: ci-s3
          S3_SECRET_ACCESS_KEY: ci-s3-password
          S3_PREFIX: adapter
        run: |
          # "rclone serve s3" is a small S3-compatible server (SigV4 auth, path-style buckets).
          docker run -d --name s3test -p 9000:9000 rclone/rclone:1.76.0 \
            serve s3 /data --addr :9000 --auth-key ci-s3,ci-s3-password
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 2; done
          # A bucket of "rclone serve s3" is a top-level folder.
          docker exec s3test mkdir -p /data/ea-hub-test
          npx vitest run src/selfhost/test/s3.test.ts src/selfhost/test/adapter.integration.test.ts

  # Managed PostgreSQL (RDS, Azure, Cloud SQL…): the admin account is not a superuser and
  # cannot grant BYPASSRLS. The setup must fall back to "owner mode" and still pass.
  managed-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Create a non-superuser owner, like a cloud database admin
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "create role cloudadmin login createrole createdb password 'cloud-admin-password'" \
            -c "create database eahub_cloud owner cloudadmin"
      - name: Prepare database as that owner (expects owner mode)
        env:
          DATABASE_ADMIN_URL: postgres://cloudadmin:cloud-admin-password@localhost:5432/eahub_cloud
        run: |
          node selfhost/scripts/migrate.mjs | tee /tmp/migrate.log
          grep -q "owner mode" /tmp/migrate.log
          node selfhost/scripts/migrate.mjs
      - name: Adapter integration tests as the owner
        env:
          SELFHOST_TEST_DATABASE_URL: postgres://cloudadmin:cloud-admin-password@localhost:5432/eahub_cloud
        run: npx vitest run src/selfhost/test

  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits regenerated deploy/kubernetes on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Backup script copies match
        run: cmp selfhost/backup/backup.sh deploy/helm/ea-hub/files/backup.sh
      - name: GitOps example values render
        run: |
          for env in staging production; do
            helm template ea-hub deploy/helm/ea-hub -f deploy/gitops/values/$env.yaml > /tmp/gitops-$env.yaml
            echo "$env: $(grep -c '^kind:' /tmp/gitops-$env.yaml) resources"
          done
          grep -q "kind: Cluster" /tmp/gitops-production.yaml
      - name: Alert rules are valid PromQL (promtool)
        run: |
          helm template ea-hub deploy/helm/ea-hub --set appUrl=https://hub.example.com             --set metrics.enabled=true --set metrics.prometheusRule.enabled=true             -s templates/alerts-dashboard.yaml > /tmp/rule.yaml
          python3 -c "import yaml; d=yaml.safe_load(open('/tmp/rule.yaml')); yaml.safe_dump(d['spec'], open('/tmp/rules.yaml','w'))"
          docker run --rm -v /tmp/rules.yaml:/rules.yaml:ro --entrypoint promtool prom/prometheus:v3.16.0 check rules /rules.yaml
      - name: Chart unit tests (helm-unittest, Helm 3)
        run: |
          mkdir -p /tmp/helm3 && cd /tmp/helm3
          curl -fsSL https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz | tar xz
          H=/tmp/helm3/linux-amd64/helm
          $H plugin install https://github.com/helm-unittest/helm-unittest --version v1.3.0
          cd "$GITHUB_WORKSPACE" && $H unittest deploy/helm/ea-hub
      - name: helm lint
        run: |
          helm lint deploy/helm/ea-hub --strict --set appUrl=https://hub.example.com
          helm lint deploy/helm/ea-hub --strict -f deploy/helm/ci-values.yaml
      - name: helm template (default, ingress + TLS, external database)
        run: |
          helm template ea-hub deploy/helm/ea-hub --set appUrl=https://hub.example.com > /tmp/default.yaml
          helm template ea-hub deploy/helm/ea-hub -f deploy/helm/ci-values.yaml > /tmp/ingress.yaml
          helm template ea-hub deploy/helm/ea-hub --set appUrl=https://hub.example.com \
            --set postgres.enabled=false --set externalDatabase.host=db.example.com \
            --set externalDatabase.sslmode=require > /tmp/external.yaml
          grep -q "kind: StatefulSet" /tmp/default.yaml
          if grep -q "kind: StatefulSet" /tmp/external.yaml; then exit 1; fi
          grep -q "kind: Ingress" /tmp/ingress.yaml
      - name: OpenShift mode (no fixed UIDs, Debian postgres, Route)
        run: |
          helm lint deploy/helm/ea-hub --strict --set appUrl=https://hub.apps.example.com --set openshift.enabled=true
          helm template ea-hub deploy/helm/ea-hub --set appUrl=https://hub.apps.example.com --set openshift.enabled=true > /tmp/os.yaml
          if grep -qE "runAsUser|fsGroup" /tmp/os.yaml; then echo "fixed UID in OpenShift mode"; exit 1; fi
          grep -q "kind: Route" /tmp/os.yaml
          grep -q "image: postgres:16$" /tmp/os.yaml
      - name: Schema rejects bad values
        run: |
          if helm template x deploy/helm/ea-hub --set appUrl=not-a-url >/dev/null 2>&1; then exit 1; fi
          if helm template x deploy/helm/ea-hub --set appUrl=https://a.b --set admin.password=short >/dev/null 2>&1; then exit 1; fi
      - name: Catalog metadata (Artifact Hub, Rancher, OpenShift)
        run: |
          for f in README.md app-readme.md questions.yaml; do test -s deploy/helm/ea-hub/$f; done
          grep -q '^kubeVersion:' deploy/helm/ea-hub/Chart.yaml
          grep -q 'charts.openshift.io/name' deploy/helm/ea-hub/Chart.yaml
          # Every Rancher question must be a real value.
          python3 - <<'PY'
          import yaml
          v = yaml.safe_load(open("deploy/helm/ea-hub/values.yaml"))
          q = yaml.safe_load(open("deploy/helm/ea-hub/questions.yaml"))["questions"]
          def walk(qs):
              for x in qs:
                  yield x["variable"]; yield from walk(x.get("subquestions", []))
          bad = []
          for name in walk(q):
              if chr(92) in name: continue  # escaped dots = annotation keys
              cur = v
              for part in name.split("."):
                  if not isinstance(cur, dict) or part not in cur: bad.append(name); break
                  cur = cur[part]
          assert not bad, f"questions.yaml variables not in values.yaml: {bad}"
          PY
      - name: Red Hat chart-verifier (community profile)
        run: |
          docker run --rm -v "$PWD/deploy/helm:/charts:z" quay.io/redhat-certification/chart-verifier:latest             verify --set profile.vendortype=community -x chart-testing /charts/ea-hub > /tmp/report.yaml || true
          cat /tmp/report.yaml
          python3 - <<'PY'
          import yaml
          r = yaml.safe_load(open("/tmp/report.yaml"))
          fails = [x for x in r["results"] if x["outcome"] == "FAIL" and x.get("type") == "Mandatory"]
          for x in fails: print("::error::", x["check"], "-", x.get("reason"))
          assert not fails
          PY
      - name: Render raw Kubernetes manifests from the chart
        run: bash deploy/kubernetes/render.sh
      - name: Commit regenerated manifests (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- deploy/kubernetes; then echo "manifests up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kubernetes
          git commit -m "chore: regenerate deploy/kubernetes from the Helm chart"
          git push
      - name: Note when manifests differ (pull requests)
        if: github.event_name != 'push'
        run: git diff --quiet -- deploy/kubernetes || echo "::notice::deploy/kubernetes will be regenerated on merge"

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a test .env (what setup.sh writes)
        run: |
          {
            echo "APP_URL=http://localhost:8080"
            echo "SITE_ADDRESS=:80"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
            echo "ADMIN_EMAIL=e2e-admin@example.com"
            echo "ADMIN_PASSWORD=e2e-admin-password"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "EA_HUB_IMAGE=ea-hub-selfhost:ci"
            echo "WITH_LOCAL_MODEL=0"
            echo "METRICS_TOKEN=e2e-metrics-token"
          } > .env
      - name: docker compose up (from scratch)
        run: |
          docker compose build
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 5
          done
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
      - name: Vulnerability scan of the app image (critical, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ea-hub-selfhost:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Site, admin sign-in and admin API
        run: |
          curl -fsSL -o /dev/null -w "home %{http_code}\n" http://localhost:8080/
          curl -fsS -o /dev/null -w "admin %{http_code}\n" http://localhost:8080/admin
          TOKEN=$(curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"email":"e2e-admin@example.com","password":"e2e-admin-password"}' \
            "http://localhost:8080/api/selfhost/auth/token?grant_type=password" | jq -r .access_token)
          test -n "$TOKEN" && test "$TOKEN" != null
          curl -fsS -H "authorization: Bearer $TOKEN" http://localhost:8080/api/selfhost/auth/user \
            | jq -e '.email == "e2e-admin@example.com"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"email":"e2e-admin@example.com","password":"nope-nope-nope"}' \
            'http://localhost:8080/api/selfhost/auth/token?grant_type=password')
          test "$code" = 400
      - name: Realtime (LISTEN/NOTIFY → SSE) through Caddy
        run: |
          TOKEN=$(curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"email":"e2e-admin@example.com","password":"e2e-admin-password"}' \
            "http://localhost:8080/api/selfhost/auth/token?grant_type=password" | jq -r .access_token)
          curl -sN -m 20 -X POST -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"subscriptions":[{"id":1,"event":"INSERT","schema":"public","table":"live_chats"}]}' \
            http://localhost:8080/api/selfhost/realtime > /tmp/sse.txt &
          sleep 4
          docker compose exec -T db psql -U postgres -d eahub -c \
            "insert into public.live_chats (visitor_id, visitor_email) values (gen_random_uuid(), 'sse-e2e@example.com')"
          sleep 6
          cat /tmp/sse.txt | cut -c1-200
          grep -q 'sse-e2e@example.com' /tmp/sse.txt
      - name: Image runs under a random UID (OpenShift)
        run: |
          docker run --rm --user 1000770000:0 --entrypoint node ea-hub-selfhost:ci -e \
            "require('fs').writeFileSync('/data/storage/probe','ok'); require('fs').accessSync('/app/.output/server/index.mjs'); console.log('random uid ok')"
      - name: Scheduled job and backup
        run: |
          docker compose exec -T cron node selfhost/scripts/run-job.mjs daily-cleanup
          docker compose exec -T backup sh /backup/backup.sh now
          docker compose exec -T backup sh /backup/backup.sh list | grep -E '^20'
      - name: Restore drill (backup → delete → restore → verify)
        run: |
          psql() { docker compose exec -T db psql -U postgres -d eahub -tAc "$1"; }
          psql "create table if not exists public.ci_restore_marker (v text); insert into public.ci_restore_marker values ('before-backup');"
          docker compose exec -T backup sh -c 'echo restore-me > /data/storage/ci-restore-marker.txt'
          sleep 61   # backup folder names are per minute: make this one new
          docker compose exec -T backup sh /backup/backup.sh now
          NAME=$(docker compose exec -T backup sh /backup/backup.sh list | grep -E '^20' | tail -1 | tr -d '\r')
          echo "restoring $NAME"
          psql "drop table public.ci_restore_marker;"
          docker compose exec -T backup rm /data/storage/ci-restore-marker.txt
          docker compose stop app cron
          docker compose exec -T backup sh /backup/backup.sh restore "$NAME"
          test "$(psql 'select v from public.ci_restore_marker')" = "before-backup"
          test "$(docker compose exec -T backup cat /data/storage/ci-restore-marker.txt | tr -d '\r')" = "restore-me"
          docker compose start app cron
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 3; done
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
      - name: Metrics endpoint (token required)
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)" = 401
          curl -fsS -H 'authorization: Bearer e2e-metrics-token' http://localhost:8080/metrics | tee /tmp/metrics.txt
          grep -q '^eahub_database_up 1' /tmp/metrics.txt
      - name: Encrypted backups (public key; restore needs the private key)
        run: |
          KEYS=$(docker compose run --rm --no-deps migrate node selfhost/scripts/backup-crypt.mjs keygen)
          PUB=$(echo "$KEYS" | sed -n 's/^BACKUP_PUBLIC_KEY=//p' | tr -d '\r')
          PRIV=$(echo "$KEYS" | sed -n 's/^BACKUP_PRIVATE_KEY=//p' | tr -d '\r')
          echo "BACKUP_PUBLIC_KEY=$PUB" >> .env
          sleep 61
          docker compose exec -T backup sh /backup/backup.sh now
          NAME=$(docker compose exec -T backup sh /backup/backup.sh list | grep -E '^20' | tail -1 | tr -d '\r')
          docker compose --profile encrypt up -d backup-crypt
          for i in $(seq 1 30); do ls "backups/$NAME" | grep -q 'database.dump.enc' && break; sleep 3; done
          ls -l "backups/$NAME"
          test -f "backups/$NAME/database.dump.enc" && test ! -f "backups/$NAME/database.dump"
          # Restore refuses encrypted files, then works after decryption with the private key.
          if docker compose exec -T backup sh /backup/backup.sh restore "$NAME"; then exit 1; fi
          docker compose --profile encrypt run --rm -e BACKUP_PRIVATE_KEY="$PRIV" backup-crypt             node selfhost/scripts/backup-crypt.mjs decrypt-dir "/backups/$NAME"
          test -f "backups/$NAME/database.dump"
          docker compose --profile encrypt stop backup-crypt
      - name: Offsite copy of the backups (rclone → a test S3 server)
        run: |
          # A throwaway S3 server ("rclone serve s3") on the compose network, reachable as "s3test".
          docker run -d --name s3test --network ea-hub_default rclone/rclone:1.76.0 \
            serve s3 /data --addr :9000 --auth-key ci-s3,ci-s3-password
          sleep 5
          cat >> .env <<'ENV'
          COMPOSE_PROFILES=offsite
          OFFSITE_PATH=eahub-backups/ci
          OFFSITE_PROVIDER=Rclone
          OFFSITE_ENDPOINT=http://s3test:9000
          OFFSITE_ACCESS_KEY_ID=ci-s3
          OFFSITE_SECRET_ACCESS_KEY=ci-s3-password
          ENV
          docker compose run --rm --no-deps --entrypoint rclone offsite mkdir offsite:eahub-backups
          docker compose up -d offsite
          for i in $(seq 1 24); do
            docker compose run --rm --no-deps --entrypoint rclone offsite ls offsite:eahub-backups/ci \
              2>/dev/null | grep -q database.dump && break
            sleep 5
          done
          docker compose logs offsite | tail -5
          docker compose run --rm --no-deps --entrypoint rclone offsite ls offsite:eahub-backups/ci | grep database.dump
      - name: Rotate all secrets (database passwords, cron secret, metrics token)
        run: |
          bash selfhost/scripts/rotate-secrets.sh all
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"email":"e2e-admin@example.com","password":"e2e-admin-password"}' \
            "http://localhost:8080/api/selfhost/auth/token?grant_type=password" | jq -e '.access_token | length > 20'
          docker compose exec -T cron node selfhost/scripts/run-job.mjs daily-cleanup
          sleep 61
          docker compose exec -T backup sh /backup/backup.sh now
          TOKEN=$(grep '^METRICS_TOKEN=' .env | cut -d= -f2)
          curl -fsS -H "authorization: Bearer $TOKEN" http://localhost:8080/metrics | grep -q '^eahub_database_up 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'authorization: Bearer e2e-metrics-token' http://localhost:8080/metrics)" = 401
      - name: PostgreSQL major upgrade 16 -> 17 keeps the data
        run: |
          bash selfhost/scripts/pg-major-upgrade.sh 17 --yes
          docker compose exec -T db psql -U postgres -tAc 'show server_version' | grep '^17\.'
          test "$(docker compose exec -T db psql -U postgres -d eahub -tAc 'select v from public.ci_restore_marker')" = "before-backup"
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 3; done
          curl -fsS -X POST -H 'content-type: application/json'             -d '{"email":"e2e-admin@example.com","password":"e2e-admin-password"}'             "http://localhost:8080/api/selfhost/auth/token?grant_type=password" | jq -e '.access_token | length > 20'
          docker volume inspect ea-hub_db-data-pg16 >/dev/null   # the old data is kept
      - name: Restart keeps data (migrate is idempotent)
        run: |
          docker compose up -d --force-recreate migrate app
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 5
          done
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - run: docker compose down -v

  # A real browser against the compose stack: password sign-in, and single sign-on through a
  # real Keycloak (admin by group, refused staff member, refused outside domain).
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Chromium for Playwright
        run: npx playwright-core install --with-deps chromium
      - name: Write .env (with single sign-on)
        run: |
          {
            echo "APP_URL=http://localhost:8080"
            echo "SITE_ADDRESS=:80"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
            echo "ADMIN_EMAIL=e2e-admin@example.com"
            echo "ADMIN_PASSWORD=e2e-admin-password"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "EA_HUB_IMAGE=ea-hub-selfhost:ci"
            echo "WITH_LOCAL_MODEL=0"
            echo "OIDC_ISSUER=http://keycloak:8180/realms/ea-hub"
            echo "OIDC_CLIENT_ID=ea-hub"
            echo "OIDC_CLIENT_SECRET=ci-oidc-client-secret"
            echo "OIDC_ALLOWED_DOMAINS=acme.example"
            echo "OIDC_ADMIN_GROUPS=ea-admins"
          } > .env
          # Keycloak runs without TLS here: allow an http issuer for this test only.
          {
            echo "services:"
            echo "  app:"
            echo "    environment:"
            echo "      OIDC_ALLOW_HTTP_ISSUER: \"true\""
          } > docker-compose.e2e.yml
      - name: Start EA-Hub and Keycloak
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml build
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
          docker run -d --name keycloak --network ea-hub_default --network-alias keycloak -p 8180:8180             -v "$PWD/selfhost/e2e/keycloak-realm.json:/opt/keycloak/data/import/ea-hub.json:ro"             quay.io/keycloak/keycloak:26.8.2 start-dev --import-realm --http-port 8180             --hostname http://keycloak:8180
          echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts
          for i in $(seq 1 60); do
            curl -fsS http://keycloak:8180/realms/ea-hub/.well-known/openid-configuration >/dev/null && break
            sleep 5
          done
          curl -fsS http://keycloak:8180/realms/ea-hub/.well-known/openid-configuration | jq -r .issuer
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 5; done
          curl -fsS http://localhost:8080/api/selfhost/auth/settings | jq -e '.sso.enabled == true'
      - name: Browser checks (Playwright, Chromium)
        run: node selfhost/e2e/admin-sso.e2e.mjs
      - name: Screenshots and logs on failure
        if: failure()
        run: |
          docker compose logs app --tail=100 || true
          docker logs keycloak --tail=50 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-e2e-screenshots
          path: e2e-*.png
          if-no-files-found: ignore

  # PostgreSQL high availability: the chart with the CloudNativePG operator, 2 instances,
  # including a failover of the primary while the app keeps working.
  kind-cloudnativepg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ea-hub
      - name: CloudNativePG operator
        run: |
          kubectl apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.2/cnpg-1.30.2.yaml
          kubectl -n cnpg-system rollout status deploy/cnpg-controller-manager --timeout=5m
      - name: Build image and load it into kind
        run: |
          docker build --build-arg WITH_LOCAL_MODEL=0 -t ea-hub-selfhost:ci .
          kind load docker-image ea-hub-selfhost:ci --name ea-hub
      - name: helm install with CloudNativePG (2 instances)
        run: |
          helm upgrade --install ea-hub deploy/helm/ea-hub -n ea-hub --create-namespace             --set image.repository=ea-hub-selfhost --set image.tag=ci --set image.pullPolicy=Never             --set appUrl=http://localhost:8080             --set admin.email=kind-admin@example.com --set admin.password=kind-admin-password             --set postgres.cloudnativepg.enabled=true --set postgres.cloudnativepg.instances=2             --set postgres.storage.size=1Gi --set storage.size=1Gi --set backup.storage.size=1Gi             --timeout 10m
          kubectl -n ea-hub wait cluster/ea-hub-pg --for=condition=Ready --timeout=10m
          kubectl -n ea-hub rollout status deploy/ea-hub --timeout=10m
          kubectl -n ea-hub get pods
      - name: Sign-in, backup, then failover of the primary
        run: |
          kubectl -n ea-hub port-forward svc/ea-hub 8080:80 >/dev/null 2>&1 &
          sleep 5
          login() { curl -fsS -X POST -H 'content-type: application/json'             -d '{"email":"kind-admin@example.com","password":"kind-admin-password"}'             "http://localhost:8080/api/selfhost/auth/token?grant_type=password" | jq -e '.access_token | length > 20'; }
          login
          kubectl -n ea-hub create job --from=cronjob/ea-hub-backup backup-now
          kubectl -n ea-hub wait --for=condition=complete job/backup-now --timeout=5m
          PRIMARY=$(kubectl -n ea-hub get cluster ea-hub-pg -o jsonpath='{.status.currentPrimary}')
          echo "deleting primary $PRIMARY"
          kubectl -n ea-hub delete pod "$PRIMARY" --wait=false
          for i in $(seq 1 60); do
            NEW=$(kubectl -n ea-hub get cluster ea-hub-pg -o jsonpath='{.status.currentPrimary}')
            [ -n "$NEW" ] && [ "$NEW" != "$PRIMARY" ] && break
            sleep 5
          done
          echo "new primary: $NEW"; test "$NEW" != "$PRIMARY"
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz | grep -q '"ok":true' && break; sleep 5; done
          login
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n ea-hub get all,cluster || true
          kubectl -n ea-hub describe cluster ea-hub-pg | tail -40 || true
          kubectl -n ea-hub logs deploy/ea-hub -c migrate --tail=50 || true
          kubectl -n ea-hub logs deploy/ea-hub -c migrate --previous --tail=50 || true
          kubectl -n ea-hub logs ea-hub-pg-1 --tail=30 || true
          kubectl -n ea-hub logs deploy/ea-hub --tail=100 || true

  # One-click cloud templates: Bicep compiles (and the ARM file for the "Deploy to Azure"
  # button is regenerated on main), CloudFormation passes cfn-lint, Terraform validates.
  cloud-templates:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the regenerated azuredeploy.json on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure Bicep -> ARM
        run: |
          az bicep install
          az bicep build --file deploy/cloud/azure/main.bicep --outfile deploy/cloud/azure/azuredeploy.json
      - name: AWS CloudFormation (cfn-lint)
        run: |
          pip install --quiet cfn-lint
          cfn-lint deploy/cloud/aws/ea-hub.cfn.yaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Google Cloud Terraform (fmt, validate)
        working-directory: deploy/cloud/gcp
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate
      - name: Commit the regenerated ARM template (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- deploy/cloud/azure/azuredeploy.json && git ls-files --error-unmatch deploy/cloud/azure/azuredeploy.json >/dev/null 2>&1; then
            echo "azuredeploy.json up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/cloud/azure/azuredeploy.json
          git commit -m "chore: regenerate deploy/cloud/azure/azuredeploy.json from main.bicep"
          git push

  # Upgrade path: install the latest published release with data, upgrade to this code,
  # and check that nothing was lost (compose and Helm).
  upgrade-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Previous release
        id: prev
        run: echo "version=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Start the previous release
        run: |
          echo "upgrading from ${{ steps.prev.outputs.version }}"
          {
            echo "APP_URL=http://localhost:8080"
            echo "SITE_ADDRESS=:80"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
            echo "ADMIN_EMAIL=up-admin@example.com"
            echo "ADMIN_PASSWORD=up-admin-password"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "EA_HUB_IMAGE=ghcr.io/e20e-tools/ea-hub-selfhost:${{ steps.prev.outputs.version }}"
          } > .env
          docker compose pull app
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 5; done
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
      - name: Create data
        run: |
          docker compose exec -T db psql -U postgres -d eahub -c \
            "create table public.ci_upgrade_marker (v text); insert into public.ci_upgrade_marker values ('kept');"
          docker compose exec -T backup sh -c 'echo kept > /data/storage/ci-upgrade-file.txt'
          docker compose exec -T db psql -U postgres -d eahub -tAc "select count(*) from drizzle.__drizzle_migrations" > /tmp/before.txt
      - name: Upgrade to this commit
        run: |
          sed -i 's#^EA_HUB_IMAGE=.*#EA_HUB_IMAGE=ea-hub-selfhost:ci#' .env
          echo "WITH_LOCAL_MODEL=0" >> .env
          docker compose build app
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 5; done
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
      - name: Data, files and sign-in survived; a backup was taken first
        run: |
          test "$(docker compose exec -T db psql -U postgres -d eahub -tAc 'select v from public.ci_upgrade_marker')" = kept
          test "$(docker compose exec -T backup cat /data/storage/ci-upgrade-file.txt | tr -d '\r')" = kept
          echo "migrations before: $(cat /tmp/before.txt) after: $(docker compose exec -T db psql -U postgres -d eahub -tAc 'select count(*) from drizzle.__drizzle_migrations')"
          docker compose logs backup-before-migrate | grep '\[backup\].*saved'
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"email":"up-admin@example.com","password":"up-admin-password"}' \
            "http://localhost:8080/api/selfhost/auth/token?grant_type=password" | jq -e '.access_token | length > 20'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80

  upgrade-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ea-hub
      - name: Install the previous release from the published chart
        id: prev
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "version=$PREV" >> "$GITHUB_OUTPUT"
          helm install ea-hub oci://ghcr.io/e20e-tools/charts/ea-hub --version "$PREV" -n ea-hub --create-namespace \
            --set appUrl=http://localhost:8080 \
            --set admin.email=up-admin@example.com --set admin.password=up-admin-password --timeout 10m
          kubectl -n ea-hub rollout status statefulset/ea-hub-postgres --timeout=10m
          kubectl -n ea-hub rollout status deploy/ea-hub --timeout=10m
          kubectl -n ea-hub exec ea-hub-postgres-0 -- psql -U postgres -d eahub -c \
            "create table public.ci_upgrade_marker (v text); insert into public.ci_upgrade_marker values ('kept');"
          kubectl -n ea-hub get secret ea-hub -o jsonpath='{.data.app-encryption-key}' > /tmp/key-before
      - name: Build this commit and helm upgrade to it
        run: |
          docker build --build-arg WITH_LOCAL_MODEL=0 -t ea-hub-selfhost:ci .
          kind load docker-image ea-hub-selfhost:ci --name ea-hub
          helm upgrade ea-hub deploy/helm/ea-hub -n ea-hub --reuse-values \
            --set image.repository=ea-hub-selfhost --set image.tag=ci --set image.pullPolicy=Never --timeout 10m
          kubectl -n ea-hub rollout status deploy/ea-hub --timeout=10m
      - name: Data, secrets and sign-in survived; the pre-upgrade backup ran
        run: |
          test "$(kubectl -n ea-hub exec ea-hub-postgres-0 -- psql -U postgres -d eahub -tAc 'select v from public.ci_upgrade_marker')" = kept
          test "$(kubectl -n ea-hub get secret ea-hub -o jsonpath='{.data.app-encryption-key}')" = "$(cat /tmp/key-before)"
          test "$(kubectl -n ea-hub get job ea-hub-backup-before-upgrade -o jsonpath='{.status.succeeded}')" = 1
          kubectl -n ea-hub port-forward svc/ea-hub 8080:80 >/dev/null 2>&1 &
          sleep 5
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"email":"up-admin@example.com","password":"up-admin-password"}' \
            "http://localhost:8080/api/selfhost/auth/token?grant_type=password" | jq -e '.access_token | length > 20'
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n ea-hub get all || true
          kubectl -n ea-hub logs deploy/ea-hub -c migrate --tail=50 || true

  # Offline bundle: build it for the latest release, drop the images, load them from the
  # bundle and start the stack from the bundle folder without pulling anything.
  airgap-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Build the bundle (latest release, amd64)
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "PREV=$PREV" >> "$GITHUB_ENV"
          bash selfhost/airgap/build-bundle.sh "$PREV" amd64 dist
          ls -lh dist
      - name: Load it on a "clean" machine and start without pulling
        run: |
          docker image rm -f $(docker images -q) >/dev/null 2>&1 || true
          cd dist && sha256sum -c "ea-hub-airgap-${PREV}-amd64.tar.gz.sha256"
          tar xzf "ea-hub-airgap-${PREV}-amd64.tar.gz" && cd "ea-hub-airgap-${PREV}-amd64"
          ./load.sh
          cp .env.example .env
          sed -i "s#^APP_URL=.*#APP_URL=http://localhost:8080#; s#^SITE_ADDRESS=.*#SITE_ADDRESS=:80#; s#^HTTP_PORT=.*#HTTP_PORT=8080#; s#^HTTPS_PORT=.*#HTTPS_PORT=8443#" .env
          for k in POSTGRES_PASSWORD APP_DB_PASSWORD CRON_SECRET; do sed -i "s#^$k=.*#$k=$(openssl rand -hex 16)#" .env; done
          sed -i "s#^APP_ENCRYPTION_KEY=.*#APP_ENCRYPTION_KEY=$(openssl rand -hex 32)#" .env
          docker compose up -d --pull never
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 5; done
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
          helm lint "ea-hub-${PREV}.tgz" --set appUrl=https://hub.example.com

  # Security scan (OWASP ZAP baseline) and load test (k6) against the running compose stack.
  zap-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start EA-Hub (with an OpenTelemetry collector)
        run: |
          {
            echo "APP_URL=http://localhost:8080"
            echo "SITE_ADDRESS=:80"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
            echo "ADMIN_EMAIL=zap-admin@example.com"
            echo "ADMIN_PASSWORD=zap-admin-password"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "EA_HUB_IMAGE=ea-hub-selfhost:ci"
            echo "WITH_LOCAL_MODEL=0"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://otel:4318"
          } > .env
          docker compose build app
          docker compose up -d
          cat > /tmp/otel.yaml <<'EOF'
          receivers:
            otlp:
              protocols:
                http:
                  endpoint: 0.0.0.0:4318
          exporters:
            debug:
              verbosity: detailed
          service:
            pipelines:
              traces:
                receivers: [otlp]
                exporters: [debug]
          EOF
          docker run -d --name otel --network ea-hub_default -v /tmp/otel.yaml:/etc/otelcol/config.yaml:ro \
            otel/opentelemetry-collector:0.115.0
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 5; done
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
      - name: Traces reach the collector
        run: |
          for i in $(seq 1 10); do curl -fsS http://localhost:8080/admin >/dev/null; done
          sleep 8
          docker logs otel 2>&1 | grep -E 'Name +: GET /admin' | head -2
          docker logs otel 2>&1 | grep -qE 'Name +: GET /admin' || {
            docker logs otel 2>&1 | tail -40; docker compose logs app | tail -20; exit 1; }
      - name: OWASP ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          cp selfhost/security/zap-rules.tsv zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -c zap-rules.tsv -r zap-report.html -J zap-report.json -I
      - name: Load test (k6, 25 virtual users)
        run: |
          docker run --rm -i --network host -e BASE_URL=http://localhost:8080 grafana/k6:latest run \
            --summary-export=/dev/stdout - < selfhost/loadtest/k6.js | tee k6.txt
          {
            echo "### k6 load test (GitHub runner, 2 vCPU)"
            echo '```'
            grep -E 'http_req_duration|http_reqs|http_req_failed|vus_max|checks' k6.txt | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.*
          if-no-files-found: ignore

  # The release image (with the local search model) on the distroless base: the native
  # libraries of the model must load, and the image must stay free of fixable criticals/highs.
  image-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the release image
        run: docker build -t ea-hub-selfhost:full .
      - name: Local semantic search runs (onnxruntime + sharp on distroless)
        run: |
          docker run --rm --entrypoint node ea-hub-selfhost:full -e '
            import("/app/local-backend/semantic.mjs").then((m) => m.suggest("cloud architecture review",
              [{ name: "Cloud", description: "cloud architecture" }, { name: "Food", description: "restaurant menu" }], "en"))
            .then((r) => { console.log(JSON.stringify(r).slice(0, 300)); process.exit(0); })
            .catch((e) => { console.error(e); process.exit(1); });'
      - name: No shell, runs as uid 1000
        run: |
          if docker run --rm --entrypoint sh ea-hub-selfhost:full -c true 2>/dev/null; then echo "shell present"; exit 1; fi
          test "$(docker inspect -f '{{.Config.User}}' ea-hub-selfhost:full)" = "1000:0"
      - name: Vulnerability scan (critical and high, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ea-hub-selfhost:full
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ea-hub
      - name: Build image and load it into kind
        run: |
          docker build --build-arg WITH_LOCAL_MODEL=0 -t ea-hub-selfhost:ci .
          kind load docker-image ea-hub-selfhost:ci --name ea-hub
      - name: helm install
        run: |
          helm upgrade --install ea-hub deploy/helm/ea-hub -n ea-hub --create-namespace \
            --set image.repository=ea-hub-selfhost --set image.tag=ci --set image.pullPolicy=Never \
            --set appUrl=http://localhost:8080 \
            --set admin.email=kind-admin@example.com --set admin.password=kind-admin-password \
            --set metrics.enabled=true --set networkPolicy.enabled=true \
            --set backup.encryption.publicKey=ea-hub-backup-pub:Jn9HS6xMgJNzvTrPxwfZxLXlnE1QSNMRgN0oZXV6Vjk \
            --timeout 10m
          # Not --wait: with WaitForFirstConsumer storage (kind, k3s local-path, many CSI) the
          # backups PVC stays Pending until the first backup runs. Wait for the workloads.
          kubectl -n ea-hub rollout status statefulset/ea-hub-postgres --timeout=10m
          kubectl -n ea-hub rollout status deploy/ea-hub --timeout=10m
          kubectl -n ea-hub get pods
      - name: Health and sign-in through the Service
        run: |
          kubectl -n ea-hub port-forward svc/ea-hub 8080:80 >/dev/null 2>&1 &
          sleep 5
          curl -fsS http://localhost:8080/healthz | grep '"ok":true'
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"email":"kind-admin@example.com","password":"kind-admin-password"}' \
            "http://localhost:8080/api/selfhost/auth/token?grant_type=password" | jq -e '.access_token | length > 20'
          token=$(kubectl -n ea-hub get secret ea-hub -o jsonpath='{.data.metrics-token}' | base64 -d)
          curl -fsS -H "authorization: Bearer $token" http://localhost:8080/metrics | grep '^eahub_database_up 1'
      - name: helm test
        run: helm test ea-hub -n ea-hub --logs --timeout 3m
      - name: CronJob and backup run
        run: |
          kubectl -n ea-hub create job --from=cronjob/ea-hub-daily-cleanup cleanup-now
          kubectl -n ea-hub create job --from=cronjob/ea-hub-backup backup-now
          kubectl -n ea-hub wait --for=condition=complete job/cleanup-now job/backup-now --timeout=5m
          kubectl -n ea-hub logs job/backup-now -c encrypt | grep 'encrypted 2 file'   # dump + uploads
      - name: Upgrade keeps generated secrets
        run: |
          before=$(kubectl -n ea-hub get secret ea-hub -o jsonpath='{.data.app-encryption-key}')
          helm upgrade ea-hub deploy/helm/ea-hub -n ea-hub --reuse-values --timeout 10m
          kubectl -n ea-hub rollout status deploy/ea-hub --timeout=10m
          after=$(kubectl -n ea-hub get secret ea-hub -o jsonpath='{.data.app-encryption-key}')
          test "$before" = "$after"
          # The pre-upgrade hook took a backup.
          test "$(kubectl -n ea-hub get job ea-hub-backup-before-upgrade -o jsonpath='{.status.succeeded}')" = 1
          kubectl -n ea-hub logs job/ea-hub-backup-before-upgrade -c backup | grep '\[backup\].*saved'
      - name: Rotate secrets as documented (docs/en/deploy-kubernetes.md)
        run: |
          get() { kubectl -n ea-hub get secret ea-hub -o jsonpath="{.data.$1}"; }
          old_db=$(get app-db-password); old_pg=$(get postgres-password); old_metrics=$(get metrics-token)
          # --- the documented commands, verbatim ---
          new() { openssl rand -hex 24; }
          kubectl -n ea-hub patch secret ea-hub -p "{\"stringData\":{\"app-db-password\":\"$(new)\"}}"
          kubectl -n ea-hub patch secret ea-hub -p "{\"stringData\":{\"cron-secret\":\"$(new)\",\"metrics-token\":\"$(new)\"}}"
          kubectl -n ea-hub rollout restart deploy/ea-hub && kubectl -n ea-hub rollout status deploy/ea-hub
          P=$(new)
          kubectl -n ea-hub exec ea-hub-postgres-0 -- psql -U postgres -qc "alter role postgres with password '$P'"
          kubectl -n ea-hub patch secret ea-hub -p "{\"stringData\":{\"postgres-password\":\"$P\"}}"
          unset P
          # --- checks ---
          test "$(get app-db-password)" != "$old_db"; test "$(get postgres-password)" != "$old_pg"
          kubectl -n ea-hub port-forward svc/ea-hub 8081:80 >/dev/null 2>&1 &
          sleep 5
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"email":"kind-admin@example.com","password":"kind-admin-password"}' \
            "http://localhost:8081/api/selfhost/auth/token?grant_type=password" | jq -e '.access_token | length > 20'
          curl -fsS -H "authorization: Bearer $(get metrics-token | base64 -d)" http://localhost:8081/metrics | grep '^eahub_database_up 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $(echo "$old_metrics" | base64 -d)" http://localhost:8081/metrics)" = 401
          # CronJobs pick up the new values: a backup with the new superuser password, a job with the new cron secret.
          kubectl -n ea-hub create job --from=cronjob/ea-hub-backup backup-rotated
          kubectl -n ea-hub create job --from=cronjob/ea-hub-daily-cleanup cleanup-rotated
          kubectl -n ea-hub wait --for=condition=complete job/backup-rotated job/cleanup-rotated --timeout=5m
          # A later upgrade keeps the rotated values.
          db=$(get app-db-password); pg=$(get postgres-password)
          helm upgrade ea-hub deploy/helm/ea-hub -n ea-hub --reset-then-reuse-values --timeout 10m
          kubectl -n ea-hub rollout status deploy/ea-hub --timeout=10m
          test "$(get app-db-password)" = "$db"; test "$(get postgres-password)" = "$pg"
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n ea-hub get all
          kubectl -n ea-hub describe pods | tail -100
          kubectl -n ea-hub logs deploy/ea-hub -c migrate --tail=100 || true
          kubectl -n ea-hub logs deploy/ea-hub --tail=200 || true
