# Publishes the app image (and, on version tags, the Helm chart) to GitHub Container Registry.
#   tag v1.2.3      → ghcr.io/<owner>/ea-hub-selfhost:1.2.3, :1.2, :latest  (linux/amd64 + arm64)
#                     and oci://ghcr.io/<owner>/charts/ea-hub:1.2.3
#   manual run      → :sha-<short> (+ :latest when run on main)            (linux/amd64 + arm64)
# amd64 and arm64 are built on native runners (ubuntu-24.04-arm is free for public repos).
# Images are published on version tags only, not on every push: a private package on the
# GitHub Free plan has 500 MB of storage and 1 GB/month of transfer.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One native runner per architecture (no QEMU emulation: arm64 under emulation took hours).
  # Each pushes its image by digest; the "image" job then publishes one multi-arch tag list.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Names
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          p="${{ matrix.platform }}"; echo "pair=${p//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.name.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.name.outputs.pair }}
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          d="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${d#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.name.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature (Sigstore) and attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Lower-case image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.name.outputs.image }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign the image (keyless, by digest)
        run: |
          ref="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "${{ steps.name.outputs.image }}@${digest}"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"
      - name: Build provenance (SLSA, GitHub attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Software bill of materials (SPDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ steps.name.outputs.image }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: ea-hub-selfhost.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: ea-hub-selfhost.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ea-hub-selfhost.spdx.json

  # Offline (air-gapped) installation bundles, one per architecture, attached to the release.
  airgap:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, chart]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Build the bundle
        run: bash selfhost/airgap/build-bundle.sh "${GITHUB_REF_NAME#v}" ${{ matrix.arch }} dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: airgap-${{ matrix.arch }}
          path: dist/*
          retention-days: 3

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature (Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the change log
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Change log for Artifact Hub (self-host commits since the previous tag)
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          git log --no-merges --format=%s "$range" -- selfhost src/selfhost deploy Dockerfile \
            docker-compose.yml setup.sh setup.ps1 .github docs \
            | grep -vE '^(chore|Merge)' | head -25 > /tmp/changes || true
          # JSON strings are valid YAML double-quoted scalars, so quotes and backslashes are safe.
          python3 - <<'PY'
          import json
          lines = [l.strip() for l in open("/tmp/changes", encoding="utf-8") if l.strip()]
          if lines:
              with open("deploy/helm/ea-hub/Chart.yaml", "a", encoding="utf-8") as f:
                  f.write("  artifacthub.io/changes: |\n")
                  for l in lines:
                      f.write(f"    - kind: changed\n      description: {json.dumps(l)}\n")
          PY
          tail -n 30 deploy/helm/ea-hub/Chart.yaml
      - name: Package and push the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Keep the Artifact Hub image list on the released image tag.
          sed -i "s|ghcr.io/e20e-tools/ea-hub-selfhost:[0-9][0-9.]*|ghcr.io/e20e-tools/ea-hub-selfhost:$version|" deploy/helm/ea-hub/Chart.yaml
          helm package deploy/helm/ea-hub --version "$version" --app-version "$version"
          helm push "ea-hub-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" 2>&1 | tee /tmp/push.log
          digest="$(grep -o 'sha256:[0-9a-f]*' /tmp/push.log | head -1)"
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/ea-hub@${digest}"
      - name: Artifact Hub metadata for the OCI repository
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
      - run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd deploy/helm
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/ea-hub:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: ea-hub-*.tgz

  # Classic Helm repository (index.yaml) on the gh-pages branch, for Rancher, OpenShift
  # HelmChartRepository and `helm repo add`: https://<owner>.github.io/<repo>
  helm-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages # the docs workflow also pushes to gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: pages
        with:
          ref: gh-pages
          path: pages
        continue-on-error: true # first release: the branch does not exist yet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: new
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Update index.yaml
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}"
          if [ "${{ steps.pages.outcome }}" != "success" ]; then
            # A failed checkout can leave an empty repository behind: start clean on gh-pages.
            rm -rf pages && git init -q -b gh-pages pages
          fi
          mkdir -p pages/charts
          cp new/*.tgz pages/charts/
          cp src/deploy/helm/artifacthub-repo.yml pages/artifacthub-repo.yml
          touch pages/.nojekyll
          printf '# EA-Hub Helm repository\n\n    helm repo add ea-hub %s\n    helm install ea-hub ea-hub/ea-hub -n ea-hub --create-namespace --set appUrl=https://hub.example.com --set admin.email=you@example.com\n' "$url" > pages/README.md
          if [ -f pages/index.yaml ]; then merge="--merge pages/index.yaml"; else merge=""; fi
          helm repo index pages --url "$url" $merge
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${GITHUB_REF_NAME}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/gh-pages

  # GitHub Release with generated notes and the packaged chart attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [chart, helm-repo, airgap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: airgap-*
          merge-multiple: true
          path: airgap
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          chart="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/ea-hub"
          {
            echo "## Install or upgrade"
            echo
            echo '```bash'
            echo "helm upgrade --install ea-hub ${chart} --version ${version} -n ea-hub --create-namespace --reset-then-reuse-values"
            echo '```'
            echo
            echo "- Image: \`${image}:${version}\` (linux/amd64, linux/arm64), signed with cosign (keyless)."
            echo "- Docker Compose: set \`EA_HUB_IMAGE=${image}:${version}\` in \`.env\`, then \`docker compose pull && docker compose up -d\`."
            echo "- Verify the signature: \`cosign verify ${image}:${version} --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
            echo "- Verify the build provenance: \`gh attestation verify oci://${image}:${version} --repo ${GITHUB_REPOSITORY}\`"
            echo "- SBOM (SPDX): \`ea-hub-selfhost.spdx.json\`. Offline install: \`ea-hub-airgap-${version}-<arch>.tar.gz\` (see selfhost/airgap/README.md)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "EA-Hub self-hosted ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes \
            ea-hub-*.tgz ea-hub-selfhost.spdx.json airgap/*
