# Weekly update PRs for the self-host layer only. The app's npm dependencies come from the
# upstream EA-Hub repository through the daily upstream sync, so they are not managed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: "deps(actions)" }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "deps(docker)" }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "deps(compose)" }
