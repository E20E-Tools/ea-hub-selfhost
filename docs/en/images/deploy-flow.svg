<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>EA-Hub deployment steps — Helm path and plain YAML path</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- common steps -->
  <g font-size="13">
    <rect x="30" y="30" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="130" y="58" text-anchor="middle" font-weight="700" fill="#0f172a">Step 1</text>
    <text x="130" y="78" text-anchor="middle" fill="#334155">Check prerequisites</text>

    <rect x="270" y="30" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="370" y="58" text-anchor="middle" font-weight="700" fill="#0f172a">Step 2</text>
    <text x="370" y="78" text-anchor="middle" fill="#334155">Get the code</text>

    <rect x="510" y="30" width="200" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="610" y="58" text-anchor="middle" font-weight="700" fill="#0f172a">Step 3</text>
    <text x="610" y="78" text-anchor="middle" fill="#334155">Make the image available</text>

    <rect x="750" y="30" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
    <text x="840" y="58" text-anchor="middle" font-weight="700" fill="#0f172a">Step 4</text>
    <text x="840" y="78" text-anchor="middle" fill="#334155">DNS + TLS (optional)</text>
  </g>
  <line x1="230" y1="65" x2="268" y2="65" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="65" x2="508" y2="65" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="65" x2="748" y2="65" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- fork -->
  <line x1="840" y1="100" x2="840" y2="130" stroke="#475569" stroke-width="2"/>
  <line x1="245" y1="130" x2="840" y2="130" stroke="#475569" stroke-width="2"/>
  <line x1="245" y1="130" x2="245" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="715" y1="130" x2="715" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Helm path -->
  <rect x="30" y="160" width="430" height="250" rx="12" fill="#ecfdf5" stroke="#059669"/>
  <text x="245" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Path A — Helm (recommended)</text>
  <g font-size="13" fill="#065f46">
    <rect x="50" y="200" width="390" height="44" rx="8" fill="#ffffff" stroke="#059669"/>
    <text x="64" y="227">5A. Write my-values.yaml (URL, admin, ingress)</text>
    <rect x="50" y="256" width="390" height="44" rx="8" fill="#ffffff" stroke="#059669"/>
    <text x="64" y="283">6A. helm upgrade --install ea-hub … -f my-values.yaml</text>
    <rect x="50" y="312" width="390" height="44" rx="8" fill="#ffffff" stroke="#059669"/>
    <text x="64" y="339">7A. kubectl rollout status deploy/ea-hub</text>
    <text x="64" y="384" font-size="12">Secrets are generated for you and kept on upgrade.</text>
  </g>
  <line x1="245" y1="244" x2="245" y2="254" stroke="#059669" stroke-width="2" marker-end="url(#a)"/>
  <line x1="245" y1="300" x2="245" y2="310" stroke="#059669" stroke-width="2" marker-end="url(#a)"/>

  <!-- YAML path -->
  <rect x="500" y="160" width="430" height="250" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="715" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Path B — plain YAML (no Helm)</text>
  <g font-size="13" fill="#3730a3">
    <rect x="520" y="200" width="390" height="44" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="534" y="227">5B. kubectl apply namespace.yaml + your Secret</text>
    <rect x="520" y="256" width="390" height="44" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="534" y="283">6B. Edit ea-hub.yaml (host, URL, admin e-mail)</text>
    <rect x="520" y="312" width="390" height="44" rx="8" fill="#ffffff" stroke="#4f46e5"/>
    <text x="534" y="339">7B. kubectl apply -f ea-hub.yaml</text>
    <text x="534" y="384" font-size="12">You create and keep the Secret values yourself.</text>
  </g>
  <line x1="715" y1="244" x2="715" y2="254" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="715" y1="300" x2="715" y2="310" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)"/>

  <!-- join -->
  <line x1="245" y1="410" x2="245" y2="440" stroke="#475569" stroke-width="2"/>
  <line x1="715" y1="410" x2="715" y2="440" stroke="#475569" stroke-width="2"/>
  <line x1="245" y1="440" x2="715" y2="440" stroke="#475569" stroke-width="2"/>
  <line x1="480" y1="440" x2="480" y2="458" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="460" width="360" height="48" rx="24" fill="#0f172a"/>
  <text x="480" y="490" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Step 8 — open the site, sign in at /admin</text>
</svg>
