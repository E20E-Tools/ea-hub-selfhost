<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>EA-Hub on Kubernetes — what the Helm chart creates</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- users -->
  <rect x="380" y="16" width="200" height="44" rx="22" fill="#0f172a"/>
  <text x="480" y="44" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">Users' web browsers</text>
  <line x1="480" y1="60" x2="480" y2="96" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="84" fill="#475569" font-size="12">HTTPS · hub.example.com</text>

  <!-- namespace -->
  <rect x="20" y="100" width="920" height="480" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="36" y="124" fill="#334155" font-size="13" font-weight="600">Kubernetes namespace: ea-hub</text>

  <!-- ingress -->
  <rect x="380" y="136" width="200" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="480" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#075985">Ingress (optional)</text>
  <text x="480" y="176" text-anchor="middle" font-size="11" fill="#075985">TLS via cert-manager</text>
  <line x1="480" y1="186" x2="480" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- service -->
  <rect x="380" y="216" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="480" y="241" text-anchor="middle" font-size="14" font-weight="600" fill="#075985">Service ea-hub :80</text>
  <line x1="480" y1="256" x2="480" y2="284" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- deployment -->
  <rect x="300" y="286" width="360" height="140" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="480" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">Deployment ea-hub (app pod)</text>
  <rect x="318" y="320" width="150" height="90" rx="8" fill="#ffffff" stroke="#059669"/>
  <text x="393" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">1. init: migrate</text>
  <text x="393" y="362" text-anchor="middle" font-size="11" fill="#065f46">creates schema,</text>
  <text x="393" y="377" text-anchor="middle" font-size="11" fill="#065f46">roles, first admin</text>
  <text x="393" y="396" text-anchor="middle" font-size="11" fill="#065f46">then exits</text>
  <line x1="468" y1="365" x2="490" y2="365" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="492" y="320" width="150" height="90" rx="8" fill="#ffffff" stroke="#059669"/>
  <text x="567" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">2. app :3000</text>
  <text x="567" y="362" text-anchor="middle" font-size="11" fill="#065f46">Node.js web server</text>
  <text x="567" y="377" text-anchor="middle" font-size="11" fill="#065f46">health: /healthz</text>
  <text x="567" y="396" text-anchor="middle" font-size="11" fill="#065f46">runs as non-root</text>

  <!-- postgres -->
  <line x1="300" y1="356" x2="232" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="300" width="190" height="110" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="135" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">StatefulSet</text>
  <text x="135" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">ea-hub-postgres</text>
  <text x="135" y="366" text-anchor="middle" font-size="11" fill="#3730a3">PostgreSQL 16</text>
  <text x="135" y="384" text-anchor="middle" font-size="11" fill="#3730a3">(or your external DB)</text>

  <!-- secret -->
  <rect x="740" y="300" width="180" height="110" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="830" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Secret ea-hub</text>
  <text x="830" y="346" text-anchor="middle" font-size="11" fill="#92400e">DB passwords</text>
  <text x="830" y="362" text-anchor="middle" font-size="11" fill="#92400e">encryption key</text>
  <text x="830" y="378" text-anchor="middle" font-size="11" fill="#92400e">cron secret · admin pw</text>
  <text x="830" y="394" text-anchor="middle" font-size="11" fill="#92400e">optional API keys</text>
  <line x1="740" y1="356" x2="662" y2="356" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- volumes -->
  <rect x="40" y="450" width="190" height="56" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  <text x="135" y="473" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">PVC data (10Gi)</text>
  <text x="135" y="491" text-anchor="middle" font-size="11" fill="#3730a3">database files</text>
  <line x1="135" y1="410" x2="135" y2="448" stroke="#4f46e5" stroke-width="2"/>

  <rect x="392" y="450" width="176" height="56" rx="8" fill="#ffffff" stroke="#059669"/>
  <text x="480" y="473" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">PVC ea-hub-storage (5Gi)</text>
  <text x="480" y="491" text-anchor="middle" font-size="11" fill="#065f46">uploaded files</text>
  <line x1="480" y1="426" x2="480" y2="448" stroke="#059669" stroke-width="2"/>

  <!-- cronjobs -->
  <rect x="620" y="440" width="300" height="122" rx="10" fill="#fdf2f8" stroke="#db2777"/>
  <text x="770" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#9d174d">CronJobs (UTC)</text>
  <text x="640" y="484" font-size="11" fill="#9d174d">newsletter 06:00 · daily-cleanup 02:30</text>
  <text x="640" y="502" font-size="11" fill="#9d174d">semantic-index 03:15 → call the app</text>
  <text x="640" y="522" font-size="11" fill="#9d174d">backup 01:00 → pg_dump + uploads</text>
  <text x="640" y="540" font-size="11" fill="#9d174d">→ PVC ea-hub-backups (20Gi)</text>
  <line x1="660" y1="440" x2="610" y2="410" stroke="#db2777" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
</svg>
