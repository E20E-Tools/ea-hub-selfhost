        - kind: changed
          description: "CI: use rclone serve s3 as the test S3 server (minio/minio is no longer on Docker Hub)"
        - kind: changed
          description: "Chart and compose: offsite backups, metrics, NetworkPolicy, PDB, unit tests"
        - kind: changed
          description: "CI hardening: Trivy scan, cosign signing, Dependabot, GitHub Releases"
