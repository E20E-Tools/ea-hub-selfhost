  ea-hub:
  - annotations:
      artifacthub.io/category: integration-delivery
      artifacthub.io/changes: |
        - kind: changed
          description: "Release 1.2.0: chart, rendered manifests, cloud templates and GitOps examples"
        - kind: changed
          description: "Admin server status page and GitOps examples"
        - kind: changed
          description: "GCP template: compute the Cloud Run address (no post-create gcloud step)"
        - kind: changed
          description: "AWS template: RDS picks the newest 17.x minor (cfn-lint W3691 ignored for it)"
        - kind: changed
          description: "deploy/cloud README: AWS passwords are generated"
        - kind: changed
          description: "AWS template: PostgreSQL 17, RDS-managed DB password, generated admin password"
        - kind: changed
          description: "One-step cloud templates: Azure Bicep (Deploy to Azure), AWS CloudFormation, Google Cloud Terraform"
        - kind: changed
          description: "CloudNativePG: PostgreSQL 16 by default, matching the backup tools"
        - kind: changed
          description: "CloudNativePG: do not make postgres the initdb owner (the operator reset its password)"
        - kind: changed
          description: "migrate: log why the database is not ready yet; more CloudNativePG diagnostics"
        - kind: changed
          description: "Database operations: CloudNativePG option, PostgreSQL major upgrade tool, alerts and dashboard"
        - kind: changed
          description: "Browser e2e: password and SSO sign-in through a real Keycloak"
        - kind: changed
          description: "Image: Debian 13 (trixie) build stage and distroless debian13 runtime (current OpenSSL)"
        - kind: changed
          description: "Smaller attack surface and safer upgrades: distroless image, restore drill, pre-upgrade backups"
      artifacthub.io/containsSecurityUpdates: "false"
      artifacthub.io/images: |
        - name: ea-hub-selfhost
          image: ghcr.io/e20e-tools/ea-hub-selfhost:1.2.0
          platforms: [linux/amd64, linux/arm64]
        - name: postgres
          image: postgres:16-alpine
